<div class="delete-modal-container">
    <div class="delete-warning-icon">
        <i data-lucide="alert-triangle"></i>
    </div>

    <div class="delete-text-content">
        <h2 class="modal-title">¿Eliminar este curso?</h2>
        <p class="modal-description">
            Estás a punto de quitar <strong><span id="delete-course-name"></span></strong> de tu biblioteca.
        </p>
        
        <div class="alert-warning-box">
            <i data-lucide="info"></i>
            <span>Atención: Al eliminarlo, perderás todo el progreso acumulado y tus insignias.</span>
        </div>
    </div>

    <div class="modal-actions">
        <button id="cancel-delete" class="btn btn-secondary">Mantener curso</button>
        <button id="confirm-delete" class="btn btn-danger">Sí, eliminar</button>
    </div>
</div>
