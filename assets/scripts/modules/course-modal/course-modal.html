<div class="course-modal-container">
    <header class="course-modal-header">
        <div class="header-left-group">
            <button id="btn-back-to-info" class="btn-back-modal hidden" title="Regresar al temario">
                <i data-lucide="arrow-left"></i>
            </button>
            
            <div class="course-modal-titles">
                <h2 id="modal-course-title" class="course-modal-title">Nombre del curso</h2>
                
                <div id="study-mode-breadcrumb" class="study-breadcrumb hidden">
                    <span id="modal-module-title" class="breadcrumb-module">Cargando módulo...</span>
                    <span id="modal-lesson-title" class="breadcrumb-lesson">Selecciona una lección</span>
                </div>
            </div>
        </div>

        <button id="close-course-modal" class="btn-close-modal" title="Cerrar modal">
            <i data-lucide="x"></i>
        </button>
    </header>

    <main class="course-modal-body">
        <section id="courseContent" class="course-content-area">
            </section>

        <aside id="recomContent" class="recom-content-area">
            </aside>
    </main>
</div>
